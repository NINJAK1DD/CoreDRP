syntax = "proto3";

package coredrp.v1;

option csharp_namespace = "CoreDRP.V1";

service DurableRelay {
  rpc Stream(stream ClientFrame) returns (stream ServerFrame);
}

message ClientFrame {
  oneof body {
    ClientHello hello = 1;
    EventBatch batch = 2;
    ClientHeartbeat heartbeat = 3;
    ClockProbeResponse clock_probe_response = 4;
    ChainProbeResponse chain_probe_response = 5;
    Goodbye goodbye = 6;
  }
  reserved 16 to 31;
}

message ServerFrame {
  oneof body {
    ServerHello hello = 1;
    Ack ack = 2;
    ProtocolError error = 3;
    WindowUpdate window_update = 4;
    ServerHeartbeat heartbeat = 5;
    ClockProbeRequest clock_probe_request = 6;
    ChainProbeRequest chain_probe_request = 7;
    Goodbye goodbye = 8;
    ClockStateUpdate clock_state_update = 9;
  }
  reserved 16 to 31;
}

message ClientHello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  bytes sender_id = 3;
  uint32 lane_id = 4;
  bytes log_epoch = 5;
  uint64 earliest_retained_sequence = 6;
  uint64 durable_tail_sequence = 7;
  optional uint64 remembered_ack_sequence = 8;
  optional bytes remembered_ack_chain_hash = 9;
  repeated ProfileSupport profiles = 10;
  repeated uint32 supported_event_types = 11;
  string implementation_name = 12;
  string implementation_version = 13;
  string implementation_source_revision = 14;
  optional bytes remembered_contract_binding_digest = 15;
  repeated ScopeContractSupport scope_contracts = 16;
  reserved 17 to 31;
}

message ServerHello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  bytes receiver_id = 3;
  bytes receiver_database_epoch = 4;
  uint64 committed_sequence = 5;
  bytes committed_chain_hash = 6;
  repeated ProfileSelection profiles = 7;
  repeated uint32 accepted_event_types = 8;
  uint32 max_event_payload_bytes = 9;
  uint32 max_batch_payload_bytes = 10;
  uint32 window_events = 11;
  uint64 window_bytes = 12;
  bytes contract_binding_digest = 13;
  uint32 max_batch_events = 14;
  repeated ScopeContractSelection scope_contracts = 15;
  reserved 16 to 31;
}

// Each ProfileSupport row describes one exact profile version. A peer MAY
// advertise multiple minors and majors for the same profile_id.
message ProfileSupport {
  string profile_id = 1;
  uint32 profile_major = 2;
  uint32 profile_minor = 3;
  uint32 minimum_core_major = 4;
  uint32 minimum_core_minor = 5;
  optional bytes semantic_contract_digest = 6;
  reserved 7 to 15;
}

message ProfileSelection {
  string profile_id = 1;
  uint32 profile_major = 2;
  uint32 profile_minor = 3;
  optional bytes semantic_contract_digest = 4;
  reserved 5 to 15;
}

message ScopeContractSupport {
  bytes scope = 1;
  string profile_id = 2;
  bytes semantic_contract_digest = 3;
  uint32 profile_major = 4;
  uint32 profile_minor = 5;
  reserved 6 to 15;
}

message ScopeContractSelection {
  bytes scope = 1;
  string profile_id = 2;
  bytes semantic_contract_digest = 3;
  uint32 profile_major = 4;
  uint32 profile_minor = 5;
  reserved 6 to 15;
}

message EventBatch {
  uint64 first_sequence = 1;
  repeated Event events = 2;
  bytes terminal_chain_hash = 3;
  reserved 4 to 15;
}

message Event {
  uint64 sequence = 1;
  uint32 event_type = 2;
  bytes scope = 3;
  int64 event_time_unix_ms = 4;
  bytes payload = 5;
  bytes relay_event_id = 6;
  reserved 7 to 15;
}

message CompletenessCheckpoint {
  int64 complete_through_unix_ms = 1;
  reserved 2 to 15;
}

enum CoreEventType {
  CORE_EVENT_TYPE_UNSPECIFIED = 0;
  CORE_EVENT_TYPE_COMPLETENESS_CHECKPOINT = 1;
}

message Ack {
  uint64 committed_through_sequence = 1;
  bytes committed_chain_hash = 2;
  int64 committed_at_unix_ms = 3;
  reserved 4 to 15;
}

message ProtocolError {
  ErrorCode code = 1;
  ErrorDisposition disposition = 2;
  string message = 3;
  optional uint64 sequence = 4;
  reserved 5 to 15;
}

enum ErrorDisposition {
  ERROR_DISPOSITION_UNSPECIFIED = 0;
  ERROR_DISPOSITION_STREAM_RETRYABLE = 1;
  ERROR_DISPOSITION_OPERATOR_INTERVENTION = 2;
  ERROR_DISPOSITION_PERMANENT_CONFIGURATION = 3;
  ERROR_DISPOSITION_EVENT_QUARANTINABLE = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_VERSION_MISMATCH = 1;
  INVALID_HANDSHAKE = 2;
  UNAUTHORIZED_SENDER = 3;
  UNAUTHORIZED_SCOPE = 4;
  UNKNOWN_EVENT_TYPE = 5;
  UNADVERTISED_EVENT_TYPE = 6;
  EVENT_VALIDATOR_UNAVAILABLE = 7;
  SEQUENCE_GAP = 8;
  CHAIN_MISMATCH = 9;
  SPLIT_LOG = 10;
  SENDER_ROLLBACK = 11;
  RECOVERY_GAP = 12;
  EPOCH_NOT_APPROVED = 13;
  EVENT_TOO_LARGE = 14;
  SEMANTIC_CONTRACT_MISMATCH = 15;
  RECEIVER_DURABILITY_UNAVAILABLE = 16;
  CLOCK_CONTRACT_VIOLATION = 17;
  MALFORMED_FRAME = 18;
  EVENT_TYPE_OUT_OF_RANGE = 19;
  LANE_ID_OUT_OF_RANGE = 20;
  SEQUENCE_OUT_OF_RANGE = 21;
  RESOURCE_LIMIT_EXCEEDED = 22;
  CONTRACT_BINDING_CHANGED = 23;
  RECEIVER_ROLLBACK = 24;
  RECEIVER_INCARNATION_CHANGED = 25;
  STREAM_ALREADY_ACTIVE = 26;
  SEMANTIC_PAYLOAD_INVALID = 27;
  CHECKPOINT_BACKDATED_EVENT = 28;
  ADMIN_ACTION_CONFLICT = 29;
  IDEMPOTENCY_KEY_CONFLICT = 30;
  INVALID_STATE_TRANSITION = 31;
  INVALID_EVENT_PLACEMENT = 32;
  ATOMIC_RESOURCE_LIMIT_EXCEEDED = 33;
  RECEIVER_ID_CHANGED = 34;
  TEMPORAL_MEMBERSHIP_REQUIRED = 35;
  EVENT_IDENTITY_MISMATCH = 36;
  SEMANTIC_RETRY_LIMIT = 37;
  reserved 38 to 63;
}

message WindowUpdate {
  uint32 window_events = 1;
  uint64 window_bytes = 2;
  reserved 3 to 15;
}

message ClientHeartbeat {
  int64 sent_at_unix_ms = 1;
  uint64 durable_tail_sequence = 2;
  uint64 oldest_retained_sequence = 3;
  uint64 spool_bytes = 4;
  reserved 5 to 15;
}

message ServerHeartbeat {
  int64 sent_at_unix_ms = 1;
  uint64 committed_sequence = 2;
  reserved 3 to 15;
}

message ClockProbeRequest {
  uint64 probe_id = 1;
  int64 receiver_send_unix_ms = 2;
  reserved 3 to 15;
}

message ClockProbeResponse {
  uint64 probe_id = 1;
  reserved 2;
  int64 sender_receive_unix_ms = 3;
  int64 sender_send_unix_ms = 4;
  reserved 5 to 15;
}

enum ClockBoundState {
  CLOCK_BOUND_STATE_UNSPECIFIED = 0;
  CLOCK_BOUND_STATE_GOOD = 1;
  CLOCK_BOUND_STATE_BAD = 2;
  CLOCK_BOUND_STATE_UNKNOWN = 3;
}

enum ClockStateReason {
  CLOCK_STATE_REASON_UNSPECIFIED = 0;
  CLOCK_STATE_REASON_PROBE_EVIDENCE = 1;
  CLOCK_STATE_REASON_EVIDENCE_EXPIRED = 2;
  CLOCK_STATE_REASON_RECEIVER_WALL_STEP = 3;
  CLOCK_STATE_REASON_SENDER_PROCESSING_LIMIT = 4;
}

message ClockStateUpdate {
  uint64 observation_generation = 1;
  ClockBoundState state = 2;
  optional uint64 probe_id = 3;
  uint32 evidence_valid_for_ms = 4;
  uint32 effective_permitted_skew_ms = 5;
  optional int64 lower_offset_ms = 6;
  optional int64 upper_offset_ms = 7;
  ClockStateReason reason = 8;
  reserved 9 to 15;
}

message ChainProbeRequest {
  uint64 first_sequence = 1;
  uint32 count = 2;
  reserved 3 to 15;
}

message ChainProbeResponse {
  uint64 first_sequence = 1;
  repeated bytes chain_hashes = 2;
  reserved 3 to 15;
}

message Goodbye {
  GoodbyeReason reason = 1;
  string message = 2;
  reserved 3 to 15;
}

enum GoodbyeReason {
  GOODBYE_REASON_UNSPECIFIED = 0;
  GOODBYE_REASON_GRACEFUL_SHUTDOWN = 1;
  GOODBYE_REASON_DRAINING = 2;
  GOODBYE_REASON_MAINTENANCE = 3;
}
