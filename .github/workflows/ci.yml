name: CoreDRP draft checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Compile protobuf contracts
        run: |
          mkdir -p .build
          protoc \
            -I . \
            --descriptor_set_out=.build/coredrp.pb \
            --include_imports \
            protocol/coredrp-v1.proto \
            profiles/mining/coredrp-mining-v1.proto \
            profiles/miningcore/coredrp-miningcore-v1.proto

      - name: Verify core hashing test vectors
        run: python3 tools/verify_test_vectors.py

      - name: Verify profile dependency boundaries
        run: python3 tools/check_layer_boundaries.py
