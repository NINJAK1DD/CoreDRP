name: CoreDRP draft checks
on: [push, pull_request]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_spec_integrity.py
      - run: python3 tools/check_layer_boundaries.py
      - run: python3 tools/check_error_registry.py
      - run: python3 tools/check_event_registry.py
      - run: python3 tools/check_wire_compatibility.py
      - run: python3 tools/verify_test_vectors.py
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler && python3 -m pip install protobuf
      - run: mkdir -p .build && protoc -I . --descriptor_set_out=.build/coredrp.pb --include_imports --include_source_info protocol/coredrp-v1.proto profiles/mining/coredrp-mining-v1.proto profiles/miningcore/coredrp-miningcore-v1.proto
      - run: python3 tools/verify_profile_vectors.py
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet run --project tools/csharp-vector-check/CoreDRP.VectorCheck.csproj --configuration Release
      - name: Run TLA+ safety model
        run: |
          curl -fL --retry 3 -o .build/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "dbcc75552f21978a4846688b8e23be1a6b6c0b3fcee35d78fec2df167958ec94  .build/tla2tools.jar" | sha256sum -c -
          java -jar .build/tla2tools.jar -config model/CoreDRP.cfg model/CoreDRP.tla
