name: CoreDRP draft checks
on: [push, pull_request]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_spec_integrity.py
      - run: python3 tools/check_layer_boundaries.py
      - run: python3 tools/check_error_registry.py
      - run: python3 tools/check_event_registry.py
      - run: python3 tools/check_metrics_registry.py
      - run: python3 tools/check_wire_compatibility.py
      - run: python3 tools/verify_test_vectors.py
      - run: python3 tools/verify_draft05_vectors.py
      - run: python3 tools/verify_draft06_vectors.py
      - run: python3 tools/verify_state_vectors.py
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler && python3 -m pip install protobuf
      - run: mkdir -p .build && protoc -I . --descriptor_set_out=.build/coredrp.pb --include_imports --include_source_info protocol/coredrp-v1.proto profiles/mining/coredrp-mining-v1.proto profiles/miningcore/coredrp-miningcore-v1.proto
      - run: python3 tools/verify_profile_vectors.py
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet run --project tools/csharp-vector-check/CoreDRP.VectorCheck.csproj --configuration Release
      - name: Run TLA+ safety model
        run: |
          curl -fL --retry 3 -o .build/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "b658b4e504fdf0b721caf7066320f6b6fe5805f4dd2f717d0e47baba4097205e  .build/tla2tools.jar" | sha256sum -c -
          java -XX:+UseParallelGC -jar .build/tla2tools.jar -config model/CoreDRP.cfg model/CoreDRP.tla
      - name: Prove realistic TLA+ mutations are detected
        run: |
          python3 tools/mutate_tla.py
          declare -A expected=( [prune]=PruneSafe [ack]=AckSafe [drain]=NormalTransitionDrained [payout]=PayoutEvidenceSafe [exceptional_gap]=ExceptionalTransitionCovered )
          for m in prune ack drain payout exceptional_gap; do
            set +e
            java -XX:+UseParallelGC -jar .build/tla2tools.jar -config model/CoreDRP.cfg .build/mutations/$m/CoreDRP.tla > .build/tla-$m.log 2>&1
            rc=$?
            set -e
            cat .build/tla-$m.log
            if [ "$rc" -eq 0 ]; then
              echo "realistic mutation $m unexpectedly satisfied all invariants" >&2
              exit 1
            fi
            grep -q "Invariant ${expected[$m]} is violated" .build/tla-$m.log
          done
