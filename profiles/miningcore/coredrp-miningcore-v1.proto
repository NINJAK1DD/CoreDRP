syntax = "proto3";

package coredrp.miningcore.v1;

option csharp_namespace = "CoreDRP.Miningcore.V1";

import "protocol/coredrp-v1.proto";
import "profiles/mining/coredrp-mining-v1.proto";

// Draft CoreDRP/1 event-type allocation for Miningcore Integration Profile v1:
//   0x0200 = MiningcoreAccountingShareEvent
//   0x0201 = BitcoinDirectCoinbaseCandidate
//   0x0202 = CandidateStateUpdate

message MiningcoreAccountingShareEvent {
  coredrp.mining.v1.MiningShareEvent share = 1;

  // Existing Miningcore financial-accounting identity.
  // This is NOT the generic CoreDRP relay event identity.
  bytes accounting_id = 2;

  enum AccountingRole {
    ACCOUNTING_ROLE_UNSPECIFIED = 0;
    ACCOUNTING_ROLE_SINGLE = 1;
    ACCOUNTING_ROLE_PARENT = 2;
    ACCOUNTING_ROLE_AUXILIARY = 3;
  }

  AccountingRole accounting_role = 3;

  int64 reward_basis_satoshis = 4;

  // Canonical decimal string. Exact grammar is frozen in the main spec before v1 test vectors.
  string pps_calculated_amount = 5;

  // Optional paired projection. The integration profile requires atomic receiver effects.
  MiningcoreAccountingShareEvent paired_share = 6;
}

message DirectRecipient {
  string address = 1;
  bytes script_pub_key = 2;
  int64 amount_satoshis = 3;
}

message BitcoinDirectCoinbaseCandidate {
  uint64 block_height = 1;
  bytes block_hash = 2;
  bytes coinbase_txid = 3;
  bytes serialized_block = 4;

  int64 gross_reward_satoshis = 5;
  bytes miner_script_pub_key = 6;
  int64 miner_reward_satoshis = 7;
  repeated DirectRecipient recipients = 8;

  string miner = 9;
  string worker = 10;

  // Stable candidate identity.
  bytes candidate_id = 11;

  CandidateSubmissionState submission_state = 12;
}

message CandidateStateUpdate {
  bytes candidate_id = 1;
  CandidateSubmissionState state = 2;
  uint32 submission_attempts = 3;
  uint32 definitive_misses = 4;
  optional int64 last_attempt_unix_ms = 5;
}

enum CandidateSubmissionState {
  CANDIDATE_SUBMISSION_STATE_UNSPECIFIED = 0;
  CANDIDATE_SUBMISSION_STATE_PREPARED = 1;
  CANDIDATE_SUBMISSION_STATE_SUBMITTED_UNCERTAIN = 2;
  CANDIDATE_SUBMISSION_STATE_OBSERVED_ACTIVE = 3;
  CANDIDATE_SUBMISSION_STATE_REJECTED = 4;
  CANDIDATE_SUBMISSION_STATE_QUARANTINED = 5;
}
